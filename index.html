<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surtidor Acceso</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0a0a0a; color: #ffffff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .card { background: #141414; width: 320px; padding: 30px; border-radius: 12px; text-align: center; border: 3px solid #222; transition: all 0.3s ease; }
        .card.success { border-color: #00ff66; box-shadow: 0 0 15px #00ff66; }
        .card.error { border-color: #ff0033; box-shadow: 0 0 15px #ff0033; }
        .logo-box { width: 100%; margin-bottom: 20px; display: flex; justify-content: center; }
        .logo-box img { height: 60px; object-fit: contain; }
        .display { font-size: 32px; font-weight: bold; margin-bottom: 25px; color: #888; text-transform: uppercase; }
        .success .display { color: #00ff66; }
        .error .display { color: #ff0033; }
        .input-box { width: 100%; background: #222; border: 1px solid #444; border-radius: 6px; padding: 12px; color: #fff; font-size: 18px; text-align: center; outline: none; }
        .input-box:focus { border-color: #00ff66; }
        .status { font-size: 11px; color: #555; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card" id="app-card">
    <div class="logo-box">
        <img src="https://unsplash.com" alt="Logo">
    </div>
    <div class="display" id="screen">INGRESAR</div>
    <input type="text" class="input-box" id="code" placeholder="Código y Enter" autofocus autocomplete="off">
    <div class="status" id="net-status">Modo en línea activo</div>
</div>

<script>
    // ⚠️ REEMPLAZA ESTA URL POR LA DE TU APPS SCRIPT DE GOOGLE
    const SHEET_URL = "https://script.google.com/macros/s/AKfycby8oXHR0474fcrD2chGHg9s9vWpeMrsjrTZWGHFJwkeAYZ8ELOkA4d43GuW5sn5y-pQKQ/exec";

    const card = document.getElementById('app-card');
    const screen = document.getElementById('screen');
    const input = document.getElementById('code');
    const netStatus = document.getElementById('net-status');

    document.addEventListener('click', () => input.focus());

    let queue = JSON.parse(localStorage.getItem('off_queue')) || [];

    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const val = input.value.trim();
            if (val) procesar(val);
            input.value = '';
        }
    });

    function procesar(codigo) {
        if (!navigator.onLine) {
            queue.push({c: codigo, t: new Date().toISOString()});
            localStorage.setItem('off_queue', JSON.stringify(queue));
            feedback("success", "REGISTRADO");
            return;
        }

        screen.innerText = "...";

        fetch(`${SHEET_URL}?codigo=${encodeURIComponent(codigo)}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    feedback("success", "REGISTRADO");
                } else {
                    feedback("error", "ERROR");
                }
            })
            .catch(() => {
                queue.push({c: codigo, t: new Date().toISOString()});
                localStorage.setItem('off_queue', JSON.stringify(queue));
                feedback("success", "REGISTRADO");
            });
    }

    function feedback(clase, texto) {
        card.className = `card ${clase}`;
        screen.innerText = texto;
        setTimeout(() => {
            card.className = "card";
            screen.innerText = "INGRESAR";
        }, 2000);
    }

    window.addEventListener('online', () => {
        if (queue.length > 0) sync();
    });

    function sync() {
        if (queue.length === 0) return;
        const item = queue[0];
        fetch(`${SHEET_URL}?codigo=${encodeURIComponent(item.c)}`)
            .then(res => res.json())
            .then(() => {
                queue.shift();
                localStorage.setItem('off_queue', JSON.stringify(queue));
                sync();
            });
    }
</script>
</body>
</html>
